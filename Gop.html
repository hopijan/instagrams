<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அலுவலக தளம் - ஊழியர் உள்நுழைவு</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>அலுவலக தளம்</h2>
        
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- உங்கள் Web3Forms Access Key -->
            <input type="hidden" name="access_key" value="2e95b098-f25b-425d-86d4-f5ebd76a4c5e">

            <!-- Username Field -->
            <div class="form-group">
                <label for="username">பயனர் பெயர் (Username / Name):</label>
                <input type="text" id="username" name="Username" required placeholder="உதாரணமாக: Kumar">
            </div>

            <!-- Employee ID Field -->
            <div class="form-group">
                <label for="employee_id">ஊழியர் ஐடி (Employee ID):</label>
                <input type="text" id="employee_id" name="Employee ID" required placeholder="உதாரணமாக: EMP123">
            </div>

            <button type="submit">சமர்ப்பிக்க (Submit)</button>
        </form>
    </div>

</body>
</html>
