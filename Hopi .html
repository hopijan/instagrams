<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அலுவலக தளம் - ஊழியர் உள்நுழைவு</title>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;

            justify-content: center;

            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;

        }
        h2 {

            color: #333;
            text-align: center;
        }

            margin-bottom: 15px;
        }

            display: block;
            margin-bottom: 5px;
            color: #666;

        }
        input {

            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {

            padding: 10px;
            background-color: #007bff;

            border: none;
            border-radius: 4px;
